/* ============================ HELPERS ============================ */

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayISO() { return new Date().toISOString().slice(0,10); }

function currentMonthLabel() {
  var d = new Date();
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return months[d.getMonth()] + " " + d.getFullYear();
}

function monthLabelToIndex(label) {
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var parts = label.split(" ");
  var mi = months.indexOf(parts[0]);
  var y = parseInt(parts[1], 10);
  return y * 12 + mi;
}

function sortedMonthLabels(history) {
  var set = {};
  (history || []).forEach(function (h) { set[h.monthLabel] = true; });
  var labels = Object.keys(set);
  labels.sort(function (a, b) { return monthLabelToIndex(a) - monthLabelToIndex(b); });
  return labels;
}

function monthLabelToDateRange(label) {
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var parts = label.split(" ");
  var mi = months.indexOf(parts[0]);
  var y = parseInt(parts[1], 10);
  var start = new Date(y, mi, 1);
  var end = new Date(y, mi + 1, 0);
  return { start: start, end: end };
}

function dateInRange(dateStr, fromLabel, toLabel) {
  var d = new Date(dateStr);
  var r1 = monthLabelToDateRange(fromLabel);
  var r2 = monthLabelToDateRange(toLabel);
  return d >= r1.start && d <= r2.end;
}

function filterHistoryByRange(history, fromLabel, toLabel) {
  var fi = monthLabelToIndex(fromLabel);
  var ti = monthLabelToIndex(toLabel);
  return (history || []).filter(function (h) {
    var idx = monthLabelToIndex(h.monthLabel);
    return idx >= fi && idx <= ti;
  });
}

function getDailyQuote() {
  var start = new Date(2024, 0, 1);
  var now = new Date();
  var days = Math.floor((now - start) / (1000 * 60 * 60 * 24));
  var index = ((days % QUOTES.length) + QUOTES.length) % QUOTES.length;
  return QUOTES[index];
}

function defaultTypeForName(name) {
  return CATEGORY_TYPE_BY_NAME[name] || "other";
}

function makeCategory(name) {
  var isOtherIncome = name === "Other Income / Investment Returns";
  return {
    id: uid(),
    name: name,
    method: "percentage",
    type: defaultTypeForName(name),
    percent: 0,
    fixedAmount: 0,
    amount: 0,
    notes: "",
    included: true,
    sources: {
      salary: !isOtherIncome,
      business: false,
      investment: false,
      bonus: false,
      other: isOtherIncome
    }
  };
}

function defaultTemplate() {
  return DEFAULT_CATEGORY_NAMES.map(function (n) { return makeCategory(n); });
}

function freshData() {
  return {
    version: DATA_VERSION,
    ownerName: "",
    template: defaultTemplate(),
    history: [],
    adjustments: [],
    transfers: [],
    withdrawals: [],
    currentMonth: {
      salary: 0,
      salaryInput: "",
      presentUsageAdded: 0,
      categories: defaultTemplate(),
      monthLabel: currentMonthLabel()
    },
    updatedAt: Date.now()
  };
}

function loadLegacyData() {
  for (var i = 0; i < LEGACY_DATA_KEYS.length; i++) {
    var raw = localStorage.getItem(LEGACY_DATA_KEYS[i]);
    if (raw) { try { return JSON.parse(raw); } catch (e) {} }
  }
  var t = localStorage.getItem("budgetApp_template_v1");
  var h = localStorage.getItem("budgetApp_history_v1");
  if (t || h) {
    try {
      return { version: 1, template: t ? JSON.parse(t) : defaultTemplate(), history: h ? JSON.parse(h) : [] };
    } catch (e) {}
  }
  return null;
}

function migrate(d) {
  if (!d) return freshData();
  var data = Object.assign({}, d);
  if (!data.version) data.version = 1;
  if (data.ownerName === undefined) data.ownerName = "";
  if (!data.template) data.template = defaultTemplate();
  if (!data.history) data.history = [];
  if (!data.adjustments) data.adjustments = [];
  if (!data.transfers) data.transfers = [];
  if (!data.withdrawals) data.withdrawals = [];
  if (!data.currentMonth) {
    data.currentMonth = { salary: 0, salaryInput: "", presentUsageAdded: 0, categories: defaultTemplate(), monthLabel: currentMonthLabel() };
  }
  if (data.currentMonth.presentUsageAdded === undefined) data.currentMonth.presentUsageAdded = 0;
  if (data.currentMonth.salaryInput === undefined) data.currentMonth.salaryInput = String(data.currentMonth.salary || "");

  function fixCategoryList(list) {
    return (list || []).map(function (c) {
      var cat = Object.assign({}, c);
      if (!cat.id) cat.id = uid();
      if (!cat.method) cat.method = "percentage";
      if (cat.percent === undefined) cat.percent = 0;
      if (cat.fixedAmount === undefined) cat.fixedAmount = 0;
      if (cat.amount === undefined) cat.amount = 0;
      if (cat.notes === undefined) cat.notes = "";
      if (cat.included === undefined) cat.included = true;
      if (!cat.sources) cat.sources = { salary: true, business: false, investment: false, bonus: false, other: false };
      if (!cat.type) cat.type = defaultTypeForName(cat.name);
      if (SAVINGS_NAMES.indexOf(cat.name) !== -1) cat.type = "savings";
      if (cat.name === "Personal Learning") cat.type = "personalInvestment";
      return cat;
    });
  }

  data.template = fixCategoryList(data.template);
  data.currentMonth.categories = fixCategoryList(data.currentMonth.categories);
  data.history = (data.history || []).map(function (h) { return Object.assign({}, h, { categories: fixCategoryList(h.categories) }); });
  data.withdrawals = (data.withdrawals || []).map(function (w) {
    var ww = Object.assign({}, w);
    delete ww.applied; delete ww.appliedMonthLabel; delete ww.carriedFromPresentUsage;
    if (!ww.monthLabel) ww.monthLabel = data.currentMonth.monthLabel;
    return ww;
  });

  data.version = DATA_VERSION;
  if (!data.updatedAt) data.updatedAt = Date.now();
  return data;
}

function loadLocalData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return migrate(JSON.parse(raw));
    var legacy = loadLegacyData();
    if (legacy) return migrate(legacy);
    return freshData();
  } catch (e) {
    console.error("Load error:", e);
    return freshData();
  }
}

function saveLocalData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { console.error("Save error:", e); }
}

/* ======================== CALCULATION HELPERS ======================== */

function recalcForSalary(categories, salary) {
  return categories.map(function (c) {
    if (c.method === "fixed") return Object.assign({}, c, { amount: c.fixedAmount });
    if (c.method === "hybrid") return Object.assign({}, c, { amount: c.fixedAmount + salary * (c.percent / 100) });
    return Object.assign({}, c, { amount: salary * (c.percent / 100) });
  });
}

function aggregateTotals(history, adjustments, transfers, withdrawals) {
  var totals = {};
  function add(name, amt) { if (!totals[name]) totals[name] = 0; totals[name] += amt; }
  (history || []).forEach(function (h) { (h.categories || []).forEach(function (c) { if (c.included) add(c.name, c.amount); }); });
  (adjustments || []).forEach(function (a) { add(a.categoryName, a.amount); });
  (transfers || []).forEach(function (t) { add(t.fromCategory, -t.amount); add(t.toCategory, t.amount); });
  (withdrawals || []).forEach(function (w) { add(w.fromCategory, -w.amount); });
  return totals;
}

function applyWithdrawal(data, fromCategory, amount, note) {
  var w = { id: uid(), date: todayISO(), monthLabel: data.currentMonth.monthLabel, fromCategory: fromCategory, amount: amount, note: note || "" };
  var newSalary = data.currentMonth.salary + amount;
  return Object.assign({}, data, {
    withdrawals: data.withdrawals.concat([w]),
    currentMonth: Object.assign({}, data.currentMonth, {
      presentUsageAdded: data.currentMonth.presentUsageAdded + amount,
      salary: newSalary,
      categories: recalcForSalary(data.currentMonth.categories, newSalary)
    })
  });
}

function undoWithdrawalEffect(data, w) {
  var newSalary = data.currentMonth.salary - w.amount;
  return Object.assign({}, data, {
    withdrawals: data.withdrawals.filter(function (x) { return x.id !== w.id; }),
    currentMonth: Object.assign({}, data.currentMonth, {
      presentUsageAdded: data.currentMonth.presentUsageAdded - w.amount,
      salary: newSalary,
      categories: recalcForSalary(data.currentMonth.categories, newSalary)
    })
  });
}

function applyEditedWithdrawal(data, w, newFromCategory, newAmount, newNote) {
  return applyWithdrawal(undoWithdrawalEffect(data, w), newFromCategory, newAmount, newNote);
}

/* ============================ EXCEL EXPORT ============================ */

async function generateExcelReport(data, fromLabel, toLabel) {
  var workbook = new ExcelJS.Workbook();
  var filteredHistory = filterHistoryByRange(data.history, fromLabel, toLabel);

  function sumByType(type) {
    var sum = 0;
    filteredHistory.forEach(function (h) { h.categories.forEach(function (c) { if (c.included && c.type === type) sum += c.amount; }); });
    return sum;
  }

  var totalSalary = filteredHistory.reduce(function (s, h) { return s + h.salary; }, 0);

  var summarySheet = workbook.addWorksheet("Summary");
  summarySheet.getCell("A1").value = "Financial Freedom Report";
  summarySheet.getCell("A1").font = { bold: true, size: 16, color: { argb: "FF0F766E" } };
  summarySheet.getCell("A2").value = "Owner: " + (data.ownerName || "N/A");
  summarySheet.getCell("A3").value = "Period: " + fromLabel + " to " + toLabel;
  summarySheet.getCell("A4").value = "Generated: " + new Date().toLocaleString();
  var rows = [
    ["Total Salary", totalSalary],
    ["Total Expenses", sumByType("expense")],
    ["Total Savings", sumByType("savings")],
    ["Total Investments", sumByType("investment")],
    ["Total Personal Investments", sumByType("personalInvestment")],
    ["Total Other Income", sumByType("income")],
    ["Months Included", filteredHistory.length]
  ];
  rows.forEach(function (r, i) {
    var rn = 6 + i;
    summarySheet.getCell("A" + rn).value = r[0];
    summarySheet.getCell("A" + rn).font = { bold: true };
    summarySheet.getCell("B" + rn).value = r[1];
    summarySheet.getCell("B" + rn).font = { bold: true, color: { argb: "FF0F766E" } };
  });
  summarySheet.getColumn(1).width = 28;
  summarySheet.getColumn(2).width = 20;

  function buildCategorySheet(title, typeFilter, colorHex) {
    var sheet = workbook.addWorksheet(title);
    sheet.getColumn(1).width = 30; sheet.getColumn(2).width = 16; sheet.getColumn(3).width = 40;
    var row = 1;
    var banner = sheet.getCell("A" + row);
    banner.value = title + " - Grand Total: $" + sumByType(typeFilter).toFixed(2);
    banner.font = { bold: true, size: 14, color: { argb: "FFFFFFFF" } };
    banner.fill = { type: "pattern", pattern: "solid", fgColor: { argb: colorHex } };
    sheet.mergeCells("A" + row + ":C" + row);
    row += 2;

    var categoryNames = {};
    filteredHistory.forEach(function (h) { h.categories.forEach(function (c) { if (c.included && c.type === typeFilter) categoryNames[c.name] = true; }); });

    Object.keys(categoryNames).forEach(function (name) {
      var subtotal = 0;
      filteredHistory.forEach(function (h) { h.categories.forEach(function (c) { if (c.name === name && c.included && c.type === typeFilter) subtotal += c.amount; }); });
      var hCell = sheet.getCell("A" + row);
      hCell.value = name + " - Subtotal: $" + subtotal.toFixed(2);
      hCell.font = { bold: true, color: { argb: colorHex } };
      sheet.mergeCells("A" + row + ":C" + row);
      row++;
      sheet.getCell("A" + row).value = "Month"; sheet.getCell("B" + row).value = "Amount ($)"; sheet.getCell("C" + row).value = "Notes";
      sheet.getRow(row).font = { bold: true };
      row++;
      filteredHistory.forEach(function (h) {
        h.categories.forEach(function (c) {
          if (c.name === name && c.included && c.type === typeFilter) {
            sheet.getCell("A" + row).value = h.monthLabel;
            sheet.getCell("B" + row).value = c.amount;
            sheet.getCell("C" + row).value = c.notes || "";
            row++;
          }
        });
      });
      row++;
    });
  }

  buildCategorySheet("Expenses", "expense", "FF0F766E");
  buildCategorySheet("Savings", "savings", "FF0D9488");
  buildCategorySheet("Investments", "investment", "FFCA8A04");
  buildCategorySheet("Personal Investments", "personalInvestment", "FF7E22CE");
  buildCategorySheet("Other Income", "income", "FF57534E");

  function buildLogSheet(title, items, columns) {
    var sheet = workbook.addWorksheet(title);
    var headerCell = sheet.getCell("A1");
    headerCell.value = title;
    headerCell.font = { bold: true, size: 14, color: { argb: "FFFFFFFF" } };
    headerCell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF334155" } };
    sheet.mergeCells("A1:" + String.fromCharCode(64 + columns.length) + "1");
    columns.forEach(function (col, i) {
      sheet.getCell(2, i + 1).value = col.header;
      sheet.getCell(2, i + 1).font = { bold: true };
      sheet.getColumn(i + 1).width = col.width || 18;
    });
    var r = 3;
    items.forEach(function (item) {
      columns.forEach(function (col, i) { sheet.getCell(r, i + 1).value = item[col.key]; });
      r++;
    });
  }

  buildLogSheet("Adjustments", data.adjustments.filter(function (a) { return dateInRange(a.date, fromLabel, toLabel); }),
    [{ header: "Date", key: "date" }, { header: "Category", key: "categoryName", width: 26 }, { header: "Amount", key: "amount" }, { header: "Note", key: "note", width: 40 }]);
  buildLogSheet("Transfers", data.transfers.filter(function (t) { return dateInRange(t.date, fromLabel, toLabel); }),
    [{ header: "Date", key: "date" }, { header: "From", key: "fromCategory", width: 26 }, { header: "To", key: "toCategory", width: 26 }, { header: "Amount", key: "amount" }, { header: "Note", key: "note", width: 40 }]);
  buildLogSheet("Present Usage Withdrawals", data.withdrawals.filter(function (w) { return dateInRange(w.date, fromLabel, toLabel); }),
    [{ header: "Date", key: "date" }, { header: "Month", key: "monthLabel" }, { header: "From", key: "fromCategory", width: 26 }, { header: "Amount", key: "amount" }, { header: "Note", key: "note", width: 40 }]);

  var buffer = await workbook.xlsx.writeBuffer();
  var blob = new Blob([buffer], { type: "application/octet-stream" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "Financial_Freedom_Report_" + fromLabel.replace(" ", "_") + "_to_" + toLabel.replace(" ", "_") + ".xlsx";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================ CHART HOOK ============================ */

function useChartInstance(canvasRef, config, deps) {
  var chartRef = React.useRef(null);
  var depsKey = JSON.stringify(deps);
  React.useEffect(function () {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, config);
    return function () { if (chartRef.current) chartRef.current.destroy(); };
  }, [depsKey]);
}

function MonthChangeNotice(props) {
  var data = props.data; var setData = props.setData;
  function handleYes() {
    var archived = { id: uid(), date: todayISO(), monthLabel: data.currentMonth.monthLabel, salary: data.currentMonth.salary, categories: data.currentMonth.categories };
    var freshCats = recalcForSalary(data.template.map(function (c) { return Object.assign({}, c); }), 0);
    setData(Object.assign({}, data, {
      history: data.history.concat([archived]),
      currentMonth: { salary: 0, salaryInput: "", presentUsageAdded: 0, categories: freshCats, monthLabel: currentMonthLabel() }
    }));
    props.onDismiss();
  }

/* ============================ ALLOCATION TABLE ============================ */

function AllocationTable(props) {
  var categories = props.categories; var onChange = props.onChange; var showMethod = props.showMethod; var salary = props.salary;

  function updateRow(id, patch) {
    onChange(categories.map(function (c) {
      if (c.id !== id) return c;
      var merged = Object.assign({}, c, patch);
      if (patch.percent !== undefined && merged.method !== "fixed") merged.amount = salary * (merged.percent / 100) + (merged.method === "hybrid" ? merged.fixedAmount : 0);
      if (patch.amount !== undefined && merged.method === "percentage") merged.percent = salary > 0 ? (merged.amount / salary) * 100 : 0;
      if (patch.fixedAmount !== undefined) {
        if (merged.method === "fixed") merged.amount = merged.fixedAmount;
        if (merged.method === "hybrid") merged.amount = merged.fixedAmount + salary * (merged.percent / 100);
      }
      if (patch.method !== undefined) {
        if (patch.method === "fixed") merged.amount = merged.fixedAmount;
        else if (patch.method === "hybrid") merged.amount = merged.fixedAmount + salary * (merged.percent / 100);
        else merged.amount = salary * (merged.percent / 100);
      }
      return merged;
    }));
  }

  function updateSource(id, key, value) {
    onChange(categories.map(function (c) {
      if (c.id !== id) return c;
      var s = Object.assign({}, c.sources);
      s[key] = value;
      return Object.assign({}, c, { sources: s });
    }));
  }

  function moveRow(id, dir) {
    var idx = categories.findIndex(function (c) { return c.id === id; });
    var newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= categories.length) return;
    var updated = categories.slice();
    var tmp = updated[idx]; updated[idx] = updated[newIdx]; updated[newIdx] = tmp;
    onChange(updated);
  }

  function removeRow(id) { onChange(categories.filter(function (c) { return c.id !== id; })); }
  function addCategory() { onChange(categories.concat([makeCategory("New Category")])); }

  var totalPercent = categories.reduce(function (s, c) { return c.included && c.sources.salary ? s + c.percent : s; }, 0);
  var totalAmount = categories.reduce(function (s, c) { return c.included && c.sources.salary ? s + c.amount : s; }, 0);

  return (
    <div className="overflow-x-auto bg-white rounded-xl border border-stone-200 shadow-sm">
      <table className="min-w-full text-sm">
        <thead className="bg-emerald-50 text-emerald-900">
          <tr>
            <th className="p-2 text-left">Category</th>
            {showMethod ? <th className="p-2 text-left">Method</th> : null}
            {showMethod ? <th className="p-2 text-left">Type</th> : null}
            <th className="p-2 text-left">%</th>
            {showMethod ? <th className="p-2 text-left">Fixed $</th> : null}
            <th className="p-2 text-left">Amount $</th>
            <th className="p-2 text-left">Notes</th>
            <th className="p-2 text-left">Include</th>
            {showMethod ? <th className="p-2 text-left">Sources</th> : null}
            <th className="p-2 text-left">Order</th>
            <th className="p-2 text-left"></th>
          </tr>
        </thead>
        <tbody>
          {categories.map(function (c, i) {
            return (
              <tr key={c.id} className="border-t border-stone-100">
                <td className="p-2"><input className="border border-stone-300 rounded px-2 py-1 w-40" value={c.name} onChange={function (e) { updateRow(c.id, { name: e.target.value }); }} /></td>
                {showMethod ? (
                  <td className="p-2">
                    <select className="border border-stone-300 rounded px-2 py-1" value={c.method} onChange={function (e) { updateRow(c.id, { method: e.target.value }); }}>
                      <option value="percentage">Percentage</option>
                      <option value="fixed">Fixed</option>
                      <option value="hybrid">Hybrid</option>
                    </select>
                  </td>
                ) : null}
                {showMethod ? (
                  <td className="p-2">
                    <select className="border border-stone-300 rounded px-2 py-1" value={c.type} onChange={function (e) { updateRow(c.id, { type: e.target.value }); }}>
                      <option value="expense">Expense</option>
                      <option value="savings">Savings</option>
                      <option value="investment">Investment</option>
                      <option value="personalInvestment">Personal Investment</option>
                      <option value="income">Income</option>
                      <option value="other">Other</option>
                    </select>
                  </td>
                ) : null}
                <td className="p-2"><input type="number" step="0.01" className="border border-stone-300 rounded px-2 py-1 w-20" value={c.percent} onChange={function (e) { updateRow(c.id, { percent: parseFloat(e.target.value) || 0 }); }} /></td>
                {showMethod ? (
                  <td className="p-2"><input type="number" step="0.01" className="border border-stone-300 rounded px-2 py-1 w-24" value={c.fixedAmount} onChange={function (e) { updateRow(c.id, { fixedAmount: parseFloat(e.target.value) || 0 }); }} /></td>
                ) : null}
                <td className="p-2"><input type="number" step="0.01" className="border border-stone-300 rounded px-2 py-1 w-24" value={Math.round(c.amount * 100) / 100} onChange={function (e) { updateRow(c.id, { amount: parseFloat(e.target.value) || 0 }); }} /></td>
                <td className="p-2"><input className="border border-stone-300 rounded px-2 py-1 w-40" value={c.notes} onChange={function (e) { updateRow(c.id, { notes: e.target.value }); }} /></td>
                <td className="p-2 text-center"><input type="checkbox" checked={c.included} onChange={function (e) { updateRow(c.id, { included: e.target.checked }); }} /></td>
                {showMethod ? (
                  <td className="p-2">
                    <div className="flex flex-col gap-1 text-xs">
                      {["salary", "business", "investment", "bonus", "other"].map(function (key) {
                        return (
                          <label key={key} className="flex items-center gap-1">
                            <input type="checkbox" checked={c.sources[key]} onChange={function (e) { updateSource(c.id, key, e.target.checked); }} />
                            {key}
                          </label>
                        );
                      })}
                    </div>
                  </td>
                ) : null}
                <td className="p-2">
                  <button onClick={function () { moveRow(c.id, -1); }} disabled={i === 0} className="px-2">Up</button>
                  <button onClick={function () { moveRow(c.id, 1); }} disabled={i === categories.length - 1} className="px-2">Down</button>
                </td>
                <td className="p-2"><button onClick={function () { removeRow(c.id); }} className="text-rose-600">Remove</button></td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <div className="p-3 flex justify-between items-center border-t border-stone-200">
        <button onClick={addCategory} className="bg-teal-700 text-white px-3 py-1 rounded">+ Add Category</button>
        <div className="text-sm text-stone-600">Total: {totalPercent.toFixed(1)}% / ${totalAmount.toFixed(2)}</div>
      </div>
    </div>
  );
}

        </select>
        <label className="text-sm">To</label>
        <select className="border border-stone-300 rounded px-2 py-1" value={to} onChange={function (e) { setTo(e.target.value); }}>
          {months.map(function (m) { return <option key={m} value={m}>{m}</option>; })}
        </select>
      </div>
      <button onClick={handleDownload} disabled={working} className="bg-teal-700 text-white px-4 py-2 rounded">{working ? "Preparing..." : "Download Excel Report (.xlsx)"}</button>
    </div>
  );
}

/* ============================ PAGES ============================ */

function SettingsPage(props) {
  var data = props.data; var setData = props.setData;
  var [name, setName] = React.useState(data.ownerName);
  function handleTemplateChange(newCats) { setData(Object.assign({}, data, { template: newCats })); }
  function saveName() { setData(Object.assign({}, data, { ownerName: name })); }
  return (
    <div>
      <h2 className="text-xl font-bold text-emerald-800 mb-3">Budget and Allocation Settings</h2>
      <div className="bg-white rounded-xl border border-stone-200 p-4 mb-4">
        <label className="block text-sm text-stone-600 mb-1">Your Name (for report headers)</label>
        <div className="flex gap-2">
          <input className="border border-stone-300 rounded px-2 py-1 flex-1" value={name} onChange={function (e) { setName(e.target.value); }} />
          <button onClick={saveName} className="bg-emerald-700 text-white px-3 py-1 rounded">Save Name</button>
        </div>
      </div>
      <AllocationTable categories={data.template} onChange={handleTemplateChange} showMethod={true} salary={0} />
      <p className="text-xs text-stone-500 mt-2">Changes here apply to future months only. Past saved months are never changed.</p>
    </div>
  );
}

function DashboardPage(props) {
  var data = props.data; var setData = props.setData;
  var totalSalary = data.history.reduce(function (s, h) { return s + h.salary; }, 0);
  var totals = aggregateTotals(data.history, data.adjustments, data.transfers, data.withdrawals);
  var netTotal = Object.keys(totals).reduce(function (s, k) { return s + totals[k]; }, 0);

  return (
    <div>
      <h2 className="text-xl font-bold text-emerald-800 mb-3">Dashboard and Totals</h2>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div className="bg-white rounded-xl border border-stone-200 p-4"><div className="text-stone-500 text-sm">Total Salary Recorded</div><div className="text-2xl font-bold text-emerald-700">${totalSalary.toFixed(2)}</div></div>
        <div className="bg-white rounded-xl border border-stone-200 p-4"><div className="text-stone-500 text-sm">Net Total Allocated</div><div className="text-2xl font-bold text-teal-700">${netTotal.toFixed(2)}</div></div>
        <div className="bg-white rounded-xl border border-stone-200 p-4"><div className="text-stone-500 text-sm">Months Closed</div><div className="text-2xl font-bold text-amber-700">{data.history.length}</div></div>
      </div>
      <ExcelExportPanel data={data} />
      <div className="bg-white rounded-xl border border-stone-200 p-4 mb-4 overflow-x-auto">
        <h3 className="font-bold text-emerald-800 mb-2">Category Totals</h3>
        <table className="w-full text-sm"><tbody>
          {Object.keys(totals).map(function (name) { return (<tr key={name} className="border-t border-stone-100"><td className="p-1">{name}</td><td className={"p-1 " + (totals[name] < 0 ? "text-rose-600 font-semibold" : "")}>${totals[name].toFixed(2)}</td></tr>); })}
        </tbody></table>
      </div>
      <div className="bg-white rounded-xl border border-stone-200 p-4 mb-4 overflow-x-auto">
        <h3 className="font-bold text-teal-800 mb-2">Transfers</h3>
        <table className="w-full text-sm"><thead><tr><th className="text-left p-1">Date</th><th className="text-left p-1">From</th><th className="text-left p-1">To</th><th className="text-left p-1">Amount</th><th className="text-left p-1">Note</th><th></th></tr></thead>
          <tbody>{data.transfers.map(function (t) { return <TransferRow key={t.id} t={t} data={data} setData={setData} />; })}</tbody></table>
      </div>
      <div className="bg-white rounded-xl border border-stone-200 p-4 mb-4 overflow-x-auto">
        <h3 className="font-bold text-emerald-800 mb-2">Adjustments</h3>
        <table className="w-full text-sm"><thead><tr><th className="text-left p-1">Date</th><th className="text-left p-1">Category</th><th className="text-left p-1">Amount</th><th className="text-left p-1">Note</th><th></th></tr></thead>
          <tbody>{data.adjustments.map(function (a) { return <AdjustmentRow key={a.id} a={a} data={data} setData={setData} />; })}</tbody></table>
      </div>
      <div className="bg-white rounded-xl border border-stone-200 p-4 mb-4 overflow-x-auto">
        <h3 className="font-bold text-amber-700 mb-2">Present Usage Withdrawals</h3>
        <table className="w-full text-sm"><thead><tr><th className="text-left p-1">Date</th><th className="text-left p-1">From</th><th className="text-left p-1">Amount</th><th className="text-left p-1">Note</th><th></th></tr></thead>
          <tbody>{data.withdrawals.map(function (w) { return <WithdrawalRow key={w.id} w={w} data={data} setData={setData} />; })}</tbody></table>
      </div>
      <div className="mb-4">
        <h3 className="font-bold text-emerald-800 mb-2">Month-by-Month History</h3>
        {data.history.slice().reverse().map(function (h) { return <HistoryEntryCard key={h.id} h={h} data={data} setData={setData} />; })}
        {data.history.length === 0 ? <p className="text-sm text-stone-500">No months archived yet.</p> : null}
      </div>
      <ResetDatabaseButton setData={setData} />
    </div>
  );
}

function ProgressPage(props) {
  var data = props.data;
  var sorted = data.history.slice().sort(function (a, b) { return monthLabelToIndex(a.monthLabel) - monthLabelToIndex(b.monthLabel); });
  var barRef = React.useRef(null); var lineRef = React.useRef(null);
  function sumType(h, type) { return h.categories.filter(function (c) { return c.included && c.type === type; }).reduce(function (s, c) { return s + c.amount; }, 0); }
  function cumulative(arr) { var out = []; var running = 0; arr.forEach(function (v) { running += v; out.push(running); }); return out; }

  var labels = sorted.map(function (h) { return h.monthLabel; });
  var salaryArr = sorted.map(function (h) { return h.salary; });
  var expenseArr = sorted.map(function (h) { return sumType(h, "expense"); });
  var savingsArr = sorted.map(function (h) { return sumType(h, "savings"); });
  var investArr = sorted.map(function (h) { return sumType(h, "investment"); });
  var persInvArr = sorted.map(function (h) { return sumType(h, "personalInvestment"); });
  var cumSavings = cumulative(savingsArr); var cumInvest = cumulative(investArr); var cumPersInv = cumulative(persInvArr);
  var cumTotal = cumSavings.map(function (v, i) { return v + cumInvest[i] + cumPersInv[i]; });

  useChartInstance(barRef, { type: "bar", data: { labels: labels, datasets: [
    { label: "Salary", data: salaryArr, backgroundColor: "#065f46" },
    { label: "Expenses", data: expenseArr, backgroundColor: "#f43f5e" },
    { label: "Savings", data: savingsArr, backgroundColor: "#0d9488" },
    { label: "Investments", data: investArr, backgroundColor: "#ca8a04" },
    { label: "Personal Investments", data: persInvArr, backgroundColor: "#7e22ce" }
  ] }, options: { responsive: true } }, [JSON.stringify(labels), JSON.stringify(salaryArr)]);

  useChartInstance(lineRef, { type: "line", data: { labels: labels, datasets: [
    { label: "Cumulative Savings", data: cumSavings, borderColor: "#0d9488", fill: false },
    { label: "Cumulative Investments", data: cumInvest, borderColor: "#ca8a04", fill: false },
    { label: "Cumulative Personal Investments", data: cumPersInv, borderColor: "#7e22ce", fill: false },
    { label: "Total Wealth Growth", data: cumTotal, borderColor: "#065f46", fill: false, borderWidth: 3 }
  ] }, options: { responsive: true } }, [JSON.stringify(labels), JSON.stringify(cumTotal)]);

  if (sorted.length === 0) return <div className="bg-white rounded-xl border border-stone-200 p-6 text-stone-500">Archive at least one month to see your progress chart here.</div>;

  return (
    <div>
      <h2 className="text-xl font-bold text-emerald-800 mb-3">Progress Chart</h2>
      <div className="bg-white rounded-xl border border-stone-200 p-4 mb-4"><canvas ref={barRef}></canvas></div>
      <div className="bg-white rounded-xl border border-stone-200 p-4"><canvas ref={lineRef}></canvas></div>
    </div>
  );
}

function MainPage(props) {
  var data = props.data; var setData = props.setData; var setView = props.setView;
  var cm = data.currentMonth;

  function handleSalaryChange(e) {
    var val = e.target.value; var num = parseFloat(val) || 0;
    setData(Object.assign({}, data, { currentMonth: Object.assign({}, cm, { salary: num, salaryInput: val, categories: recalcForSalary(cm.categories, num) }) }));
  }
  function handleCategoriesChange(newCats) { setData(Object.assign({}, data, { currentMonth: Object.assign({}, cm, { categories: newCats }) })); }
  function saveDraft() { window.alert("Draft saved. This does not affect your permanent totals until you End Month and Archive."); }
  function saveAsDefault() { setData(Object.assign({}, data, { template: cm.categories.map(function (c) { return Object.assign({}, c); }) })); window.alert("Saved as your default template for future months."); }
  function resetToTemplate() { setData(Object.assign({}, data, { currentMonth: Object.assign({}, cm, { categories: recalcForSalary(data.template.map(function (c) { return Object.assign({}, c); }), cm.salary) }) })); }
  function endMonthAndArchive() {
    if (!window.confirm("Archive " + cm.monthLabel + " into permanent history and start a new month?")) return;
    var archived = { id: uid(), date: todayISO(), monthLabel: cm.monthLabel, salary: cm.salary, categories: cm.categories };
    var freshCats = recalcForSalary(data.template.map(function (c) { return Object.assign({}, c); }), 0);
    setData(Object.assign({}, data, { history: data.history.concat([archived]), currentMonth: { salary: 0, salaryInput: "", presentUsageAdded: 0, categories: freshCats, monthLabel: currentMonthLabel() } }));
  }

  var activeCats = cm.categories.filter(function (c) { return c.included && c.sources && c.sources.salary; });
  var totalPercent = activeCats.reduce(function (s, c) { return s + c.percent; }, 0);
  var totalAmount = activeCats.reduce(function (s, c) { return s + c.amount; }, 0);
  var remaining = cm.salary - totalAmount;
  var overPercent = totalPercent > 100.05;
  var overAmount = totalAmount > cm.salary + 0.01;

  return (
    <div>
      <h2 className="text-xl font-bold text-emerald-800 mb-3">Monthly Allocation - {cm.monthLabel}</h2>
      <div className="bg-white rounded-xl border border-stone-200 p-4 mb-4">
        <label className="block text-sm text-stone-600 mb-1">Monthly Salary</label>
        <input type="number" className="border border-stone-300 rounded px-3 py-2 w-48" value={cm.salaryInput} onChange={handleSalaryChange} placeholder="Enter salary, e.g. 2500" />
        {cm.presentUsageAdded > 0 ? <p className="text-sm text-amber-700 mt-2">+ ${cm.presentUsageAdded.toFixed(2)} added this month from Present Usage withdrawals</p> : null}
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
        <div className={"rounded-lg p-3 border " + (overPercent ? "bg-rose-50 border-rose-300" : "bg-white border-stone-200")}>
          <div className="text-xs text-stone-500">Total Allocated %</div>
          <div className={"text-lg font-bold " + (overPercent ? "text-rose-600" : "text-emerald-700")}>{totalPercent.toFixed(1)}%</div>
        </div>
        <div className={"rounded-lg p-3 border " + (overAmount ? "bg-rose-50 border-rose-300" : "bg-white border-stone-200")}>
          <div className="text-xs text-stone-500">Total Allocated $</div>
          <div className={"text-lg font-bold " + (overAmount ? "text-rose-600" : "text-teal-700")}>${totalAmount.toFixed(2)}</div>
        </div>
        <div className="rounded-lg p-3 border bg-white border-stone-200">
          <div className="text-xs text-stone-500">Remaining Unallocated</div>
          <div className="text-lg font-bold text-amber-700">${remaining.toFixed(2)}</div>
        </div>
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="lg:col-span-2">
          <AllocationTable categories={cm.categories} onChange={handleCategoriesChange} showMethod={false} salary={cm.salary} />
          <div className="flex flex-wrap gap-2 mt-4">
            <button onClick={saveDraft} className="bg-stone-600 text-white px-3 py-2 rounded">Save This Month's Draft</button>
            <button onClick={endMonthAndArchive} className="bg-emerald-700 text-white px-3 py-2 rounded">End Month and Archive to Database</button>
            <button onClick={saveAsDefault} className="bg-teal-700 text-white px-3 py-2 rounded">Save as Default Template</button>
            <button onClick={resetToTemplate} className="bg-amber-600 text-white px-3 py-2 rounded">Reset to Saved Template</button>
            <button onClick={function () {}} className="bg-stone-200 text-stone-700 px-3 py-2 rounded">Customize This Month</button>
            <button onClick={function () { setView("settings"); }} className="bg-stone-200 text-stone-700 px-3 py-2 rounded">Edit Categories and Percentages</button>
          </div>
        </div>
        <div className="lg:col-span-1"><TotalsSidebar data={data} setData={setData} /></div>
      </div>
    </div>
  );
}

function App(props) {
  var data = props.data; var setData = props.setData; var syncActive = props.syncActive;
  var [view, setView] = React.useState("main");
  var [noticeDismissed, setNoticeDismissed] = React.useState(false);
  var needsNotice = data.currentMonth.monthLabel !== currentMonthLabel() &&
    (data.currentMonth.salary > 0 || data.currentMonth.categories.some(function (c) { return c.amount !== 0; })) &&
    !noticeDismissed;

  return (
    <div className="min-h-screen bg-stone-50 px-4 py-4 max-w-6xl mx-auto">
      <Header view={view} setView={setView} syncActive={syncActive} />
      <QuoteBanner />
      {needsNotice ? <MonthChangeNotice data={data} setData={setData} onDismiss={function () { setNoticeDismissed(true); }} /> : null}
      {view === "main" ? <MainPage data={data} setData={setData} setView={setView} /> : null}
      {view === "dashboard" ? <DashboardPage data={data} setData={setData} /> : null}
      {view === "progress" ? <ProgressPage data={data} /> : null}
      {view === "settings" ? <SettingsPage data={data} setData={setData} /> : null}
      <Footer />
    </div>
  );
}

/* ============================ LOGIN + SYNC ROOT ============================ */

function LoginScreen() {
  var React = window.React;
  var useState = React.useState;

  var emailState = useState("");
  var email = emailState[0];
  var setEmail = emailState[1];

  var passwordState = useState("");
  var password = passwordState[0];
  var setPassword = passwordState[1];

  var errState = useState("");
  var err = errState[0];
  var setErr = errState[1];

  var busyState = useState(false);
  var busy = busyState[0];
  var setBusy = busyState[1];

  function handleSubmit(e) {
    if (e && e.preventDefault) e.preventDefault();
    setErr("");

    if (!email || !email.trim()) {
      setErr("Please type your Email address in the top box.");
      return;
    }
    if (!password || !password.trim()) {
      setErr("Please type your Password in the bottom box.");
      return;
    }

    setBusy(true);
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .then(function () {
        return firebase.auth().signInWithEmailAndPassword(email.trim(), password);
      })
      .then(function () {
        setBusy(false);
      })
      .catch(function (error) {
        setBusy(false);
        setErr(error && error.message ? error.message : "Sign in failed. Please check your email and password.");
      });
  }

  return React.createElement(
    "div",
    { style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#f5f3ef", padding: "20px" } },
    React.createElement(
      "form",
      { onSubmit: handleSubmit, style: { background: "#ffffff", padding: "30px", borderRadius: "12px", boxShadow: "0 2px 10px rgba(0,0,0,0.15)", width: "100%", maxWidth: "380px" } },
      React.createElement("h2", { style: { marginBottom: "20px", color: "#065f46", fontSize: "22px", fontWeight: "bold" } }, "Sign In to Your Budget App"),

      React.createElement("label", { style: { display: "block", fontWeight: "bold", marginBottom: "6px", color: "#1f2937" } }, "Email"),
      React.createElement("input", {
        type: "email",
        value: email,
        autoFocus: true,
        placeholder: "e.g. mohamad@mybudget.com",
        onChange: function (e) { setEmail(e.target.value); },
        style: { width: "100%", padding: "12px", marginBottom: "18px", border: "2px solid #0d9488", borderRadius: "8px", fontSize: "16px", boxSizing: "border-box" }
      }),

      React.createElement("label", { style: { display: "block", fontWeight: "bold", marginBottom: "6px", color: "#1f2937" } }, "Password"),
      React.createElement("input", {
        type: "password",
        value: password,
        placeholder: "Your password",
        onChange: function (e) { setPassword(e.target.value); },
        style: { width: "100%", padding: "12px", marginBottom: "18px", border: "2px solid #0d9488", borderRadius: "8px", fontSize: "16px", boxSizing: "border-box" }
      }),

      err ? React.createElement("div", { style: { color: "#dc2626", marginBottom: "14px", fontWeight: "bold", fontSize: "14px" } }, err) : null,

      React.createElement(
        "button",
        {
          type: "submit",
          disabled: busy,
          style: { width: "100%", padding: "12px", background: "#0f766e", color: "#ffffff", border: "none", borderRadius: "8px", fontSize: "16px", fontWeight: "bold", cursor: "pointer" }
        },
        busy ? "Signing in..." : "Sign In"
      )
    )
  );
}
function SyncRoot() {
  var [ready, setReady] = React.useState(false);
  var [useSync] = React.useState(isFirebaseConfigured());
  var [authUser, setAuthUser] = React.useState(null);
  var [data, setDataState] = React.useState(null);
  var lastRemoteJSON = React.useRef(null);
  var lastLocalWriteJSON = React.useRef(null);

  React.useEffect(function () {
    var local = loadLocalData();
    setDataState(local);
    if (!useSync) setReady(true);
  }, []);

  React.useEffect(function () {
    if (!useSync) return;
    var db = getFirestoreDb();
    if (!db) { setReady(true); return; }
    return firebase.auth().onAuthStateChanged(function (user) {
      setAuthUser(user);
      setReady(true);
    });
  }, [useSync]);

  React.useEffect(function () {
    if (!useSync || !authUser) return;
    var db = getFirestoreDb();
    var docRef = db.collection(SYNC_COLLECTION).doc(SYNC_DOC_ID);
    var unsub = docRef.onSnapshot(function (snap) {
      if (snap.exists()) {
        var remoteData = snap.data().payload;
        var remoteJSON = JSON.stringify(remoteData);
        if (remoteJSON !== lastLocalWriteJSON.current) {
          lastRemoteJSON.current = remoteJSON;
          var migrated = migrate(remoteData);
          setDataState(migrated);
          saveLocalData(migrated);
        }
      } else {
        var local = loadLocalData();
        var payload = Object.assign({}, local, { updatedAt: Date.now() });
        lastLocalWriteJSON.current = JSON.stringify(payload);
        docRef.set({ payload: payload });
      }
    }, function (err) { console.error("Sync error:", err); });
    return unsub;
  }, [useSync, authUser]);

  React.useEffect(function () {
    if (!data) return;
    saveLocalData(data);
    if (!useSync || !authUser) return;
    var json = JSON.stringify(data);
    if (json === lastRemoteJSON.current) return;
    lastLocalWriteJSON.current = json;
    var db = getFirestoreDb();
    var docRef = db.collection(SYNC_COLLECTION).doc(SYNC_DOC_ID);
    var t = setTimeout(function () { docRef.set({ payload: data }); }, 600);
    return function () { clearTimeout(t); };
  }, [data]);

  function setData(updater) {
    setDataState(function (prev) {
      var next = typeof updater === "function" ? updater(prev) : updater;
      return Object.assign({}, next, { updatedAt: Date.now() });
    });
  }

  if (!ready || !data) return <div className="min-h-screen flex items-center justify-center text-stone-500">Loading...</div>;
  if (useSync && !authUser) return <LoginScreen />;
  return <App data={data} setData={setData} syncActive={useSync && !!authUser} />;
}

ReactDOM.render(<SyncRoot />, document.getElementById("root"));

</script>
</body>
