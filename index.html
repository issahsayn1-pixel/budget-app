function monthLabelToIndex(label) {
  var m = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var p = label.split(" ");

}

function sortedMonthLabels(history) {
  var s={}; (history||[]).forEach(function(h){ s[h.monthLabel]=true; });
  var l=Object.keys(s);

}
function monthLabelToDateRange(label){

  var p=label.split(" "); var mi=m.indexOf(p[0]); var y=parseInt(p[1],10);
  return {start:new Date(y,mi,1), end:new Date(y,mi+1,0)};

  function hsc(e){var v=e.target.value,num=parseFloat(v)||0;setData(Object.assign({},data,{currentMonth:Object.assign({},cm,{salary:num,salaryInput:v,categories:recalcForSalary(cm.categories,num)})}))}
  function hcc(nc){setData(Object.assign({},data,{currentMonth:Object.assign({},cm,{categories:nc})}))}
  function sd(){alert("Draft saved. Does not affect permanent totals until End Month.");}
  function sad(){setData(Object.assign({},data,{template:cm.categories.map(function(c){return Object.assign({},c)})}));alert("Saved as default template.")}
  function rtt(){setData(Object.assign({},data,{currentMonth:Object.assign({},cm,{categories:recalcForSalary(data.template.map(function(c){return Object.assign({},c)}),cm.salary)})}))}
  function ema(){if(!confirm("Archive "+cm.monthLabel+"?"))return;var ar={id:uid(),date:todayISO(),monthLabel:cm.monthLabel,salary:cm.salary,categories:cm.categories};var fc=recalcForSalary(data.template.map(function(c){return Object.assign({},c)}),0);setData(Object.assign({},data,{history:data.history.concat([ar]),currentMonth:{salary:0,salaryInput:"",presentUsageAdded:0,categories:fc,monthLabel:currentMonthLabel()}}))}
  var ac=cm.categories.filter(function(c){return c.included&&c.sources&&c.sources.salary});var tp=ac.reduce(function(s,c){return s+c.percent},0);var ta=ac.reduce(function(s,c){return s+c.amount},0);var rem=cm.salary-ta;var op=tp>100.05,oa=ta>cm.salary+0.01;
  return(<div><h2 className="text-xl font-bold text-emerald-800 mb-3">Monthly Allocation - {cm.monthLabel}</h2><div className="bg-white rounded-xl border border-stone-200 p-4 mb-4"><label className="block text-sm text-stone-600 mb-1">Monthly Salary</label><input type="number"className="border border-stone-300 rounded px-3 py-2 w-48"value={cm.salaryInput}onChange={hsc}placeholder="2500"/>{cm.presentUsageAdded>0?<p className="text-sm text-amber-700 mt-2">+${cm.presentUsageAdded.toFixed(2)} from Present Usage</p>:null}</div><div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4"><div className={"rounded-lg p-3 border "+(op?"bg-rose-50 border-rose-300":"bg-white border-stone-200")}><div className="text-xs text-stone-500">Allocated %</div><div className={"text-lg font-bold "+(op?"text-rose-600":"text-emerald-700")}>{tp.toFixed(1)}%</div></div><div className={"rounded-lg p-3 border "+(oa?"bg-rose-50 border-rose-300":"bg-white border-stone-200")}><div className="text-xs text-stone-500">Allocated $</div><div className={"text-lg font-bold "+(oa?"text-rose-600":"text-teal-700")}>${ta.toFixed(2)}</div></div><div className="rounded-lg p-3 border bg-white border-stone-200"><div className="text-xs text-stone-500">Remaining</div><div className="text-lg font-bold text-amber-700">${rem.toFixed(2)}</div></div></div><div className="grid grid-cols-1 lg:grid-cols-3 gap-4"><div className="lg:col-span-2"><AllocationTable categories={cm.categories}onChange={hcc}showMethod={false}salary={cm.salary}/><div className="flex flex-wrap gap-2 mt-4"><button onClick={sd}className="bg-stone-600 text-white px-3 py-2 rounded">Save Draft</button><button onClick={ema}className="bg-emerald-700 text-white px-3 py-2 rounded">End Month & Archive</button><button onClick={sad}className="bg-teal-700 text-white px-3 py-2 rounded">Save as Default</button><button onClick={rtt}className="bg-amber-600 text-white px-3 py-2 rounded">Reset to Template</button><button onClick={function(){}}className="bg-stone-200 text-stone-700 px-3 py-2 rounded">Customize</button><button onClick={function(){setView("settings")}}className="bg-stone-200 text-stone-700 px-3 py-2 rounded">Edit Categories</button></div></div><div className="lg:col-span-1"><TotalsSidebar data={data} setData={setData}/></div></div></div>);}
function App(props){var data=props.data,setData=props.setData,sa=props.syncActive;var[view,setView]=React.useState("main");var[nd,setNd]=React.useState(false);var nn=data.currentMonth.monthLabel!==currentMonthLabel()&&(data.currentMonth.salary>0||data.currentMonth.categories.some(function(c){return c.amount!==0}))&&!nd;return(<div className="min-h-screen bg-stone-50 px-4 py-4 max-w-6xl mx-auto"><Header view={view} setView={setView} syncActive={sa}/><QuoteBanner/>{nn?<MonthChangeNotice data={data} setData={setData} onDismiss={function(){setNd(true)}}/>:null}{view==="main"?<MainPage data={data} setData={setData} setView={setView}/>:null}{view==="dashboard"?<DashboardPage data={data} setData={setData}/>:null}{view==="progress"?<ProgressPage data={data}/>:null}{view==="settings"?<SettingsPage data={data} setData={setData}/>:null}<Footer/></div>);}
function LoginScreen(){
  var R=window.React;var US=R.useState;
  var[em,setEm]=US(""),[pw,setPw]=US(""),[er,setEr]=US(""),[bu,setBu]=US(false);
  function hs(e){if(e&&e.preventDefault)e.preventDefault();setEr("");if(!em||!em.trim()){setEr("Please enter email.");return;}if(!pw||!pw.trim()){setEr("Please enter password.");return;}setBu(true);firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(function(){return firebase.auth().signInWithEmailAndPassword(em.trim(),pw)}).then(function(){setBu(false)}).catch(function(err){setBu(false);setEr(err&&err.message?err.message:"Sign in failed.")});}
  return R.createElement("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#f5f3ef",padding:"20px"}},
    R.createElement("form",{onSubmit:hs,style:{background:"#fff",padding:"30px",borderRadius:"12px",boxShadow:"0 2px 10px rgba(0,0,0,0.15)",width:"100%",maxWidth:"380px"}},
      R.createElement("h2",{style:{marginBottom:"20px",color:"#065f46",fontSize:"22px",fontWeight:"bold"}},"Sign In"),
      R.createElement("label",{style:{display:"block",fontWeight:"bold",marginBottom:"6px",color:"#1f2937"}},"Email"),
      R.createElement("input",{type:"email",value:em,autoFocus:true,placeholder:"your@email.com",onChange:function(e){setEm(e.target.value)},style:{width:"100%",padding:"12px",marginBottom:"18px",border:"2px solid #0d9488",borderRadius:"8px",fontSize:"16px",boxSizing:"border-box"}}),
      R.createElement("label",{style:{display:"block",fontWeight:"bold",marginBottom:"6px",color:"#1f2937"}},"Password"),
      R.createElement("input",{type:"password",value:pw,placeholder:"Password",onChange:function(e){setPw(e.target.value)},style:{width:"100%",padding:"12px",marginBottom:"18px",border:"2px solid #0d9488",borderRadius:"8px",fontSize:"16px",boxSizing:"border-box"}}),
      er?R.createElement("div",{style:{color:"#dc2626",marginBottom:"14px",fontWeight:"bold",fontSize:"14px"}},er):null,
      R.createElement("button",{type:"submit",disabled:bu,style:{width:"100%",padding:"12px",background:"#0f766e",color:"#fff",border:"none",borderRadius:"8px",fontSize:"16px",fontWeight:"bold",cursor:"pointer"}},bu?"Signing in...":"Sign In")
    )
  );

function SyncRoot(){
  var R=window.React;var US=R.useState;var UE=R.useEffect;var UR=R.useRef;
  var[ready,setReady]=US(false);var uSync=isFirebaseConfigured();
  var[au,setAu]=US(null);var[data,setDataState]=US(null);
  var lsj=UR(null);var wt=UR(null);var hrr=UR(null);

  UE(function(){var ld=loadLocalData();setDataState(ld);if(!uSync){setReady(true);hrr.current=true}},[]);
  UE(function(){if(!uSync)return;initFirebaseApp();var unsub=firebase.auth().onAuthStateChanged(function(u){setAu(u);setReady(true)});return function(){unsub()}},[uSync]);

  // Sync listener
  UE(function(){if(!uSync||!au)return;var db=getFirestoreDb();if(!db){hrr.current=true;return;}var dr=db.collection(SYNC_COLLECTION).doc(SYNC_DOC_ID);
    console.log("[SYNC] Attaching listener...");
    var unsub=dr.onSnapshot(function(snap){
      console.log("[SYNC] Snapshot:",snap.exists?"exists":"empty");
      if(snap.exists){var rd=snap.data(),rp=rd&&rd.payload?rd.payload:null;if(rp){var rs=JSON.stringify(rp);if(rs!==lsj.current){try{var mg=migrate(rp);lsj.current=JSON.stringify(mg);setDataState(mg);saveLocalData(mg)}catch(er){console.error("[SYNC] migrate err:",er)}}}hrr.current=true;}
      else{console.log("[SYNC] No doc - creating first copy");var cur=loadLocalData(),cs=JSON.stringify(cur);lsj.current=cs;hrr.current=true;dr.set({payload:cur,updatedAt:Date.now()}).catch(function(e){console.error("[SYNC] create err:",e)})}
    },function(err){console.error("[SYNC] listen err:",err);hrr.current=true});
    return function(){unsub()}
  },[uSync,au]);

  // Push to cloud
  UE(function(){if(!data)return;saveLocalData(data);if(!uSync||!au)return;if(!hrr.current)return;var cs=JSON.stringify(data);if(cs===lsj.current)return;if(wt.current)clearTimeout(wt.current);
    wt.current=setTimeout(function(){var db=getFirestoreDb();if(!db)return;var dr=db.collection(SYNC_COLLECTION).doc(SYNC_DOC_ID);lsj.current=cs;dr.set({payload:data,updatedAt:Date.now()}).catch(function(e){console.error("[SYNC] write err:",e)})},600)
  },[data,uSync,au]);

  function setData(fn){setDataState(function(p){var next=typeof fn==="function"?fn(p):fn;if(next&&typeof next==="object")next.updatedAt=Date.now();return next})}

  if(!ready||!data||(uSync&&!au&&!hrr.current))return R.createElement("div",{style:{padding:"40px",textAlign:"center",fontSize:"18px"}},"Loading...");
  if(uSync&&!au)return R.createElement(LoginScreen);
  return R.createElement(App,{data:data,setData:setData,syncActive:uSync&&!!au});
}
ReactDOM.render(React.createElement(SyncRoot),document.getElementById("root"));
</script>
